services:
  # Base de données relationnelle PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: sushilin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sushilin_db}
      POSTGRES_USER: ${POSTGRES_USER:-sushilin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushilin_secret_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sushilin_user} -d ${POSTGRES_DB:-sushilin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Web & Serveur Sushi Lin
  app:
    build: .
    container_name: sushilin_restaurant
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Synchronisation en temps réel de vos fichiers locaux dans le conteneur
      - .:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-sushilin_db}
      - POSTGRES_USER=${POSTGRES_USER:-sushilin_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sushilin_secret_password}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
